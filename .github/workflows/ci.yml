name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-scan:
    name: Build and SonarQube Scan
    runs-on: windows-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Backend import smoke test
        working-directory: src/backend
        run: |
          python -c "import main; print(main.app.title)"

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Frontend linting
        working-directory: src/frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: src/frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Backend linting
        working-directory: src/backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120
          pylint main.py --disable=all --enable=E,F

      - name: Backend security check
        working-directory: src/backend
        run: |
          bandit -r . -f json

      - name: Backend unit tests
        working-directory: src/backend
        run: |
          pytest . --tb=short --verbose

      - name: Frontend dependency vulnerabilities
        working-directory: src/frontend
        run: npm audit --audit-level=moderate

