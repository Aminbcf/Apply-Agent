name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-scan:
    name: Build and SonarQube Scan
    runs-on: windows-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Backend import smoke test
        working-directory: src/backend
        run: |
          python -c "import main; print(main.app.title)"

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Validate SonarQube configuration
        shell: pwsh
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if (-not $env:SONAR_TOKEN) {
            throw "SONAR_TOKEN is required for the SonarQube scan."
          }

          if (-not $env:SONAR_HOST_URL) {
            throw "SONAR_HOST_URL is required and must include http:// or https://."
          }

          if ($env:SONAR_HOST_URL -notmatch '^https?://') {
            throw "SONAR_HOST_URL must be an absolute URL such as https://sonarqube.example.com."
          }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
